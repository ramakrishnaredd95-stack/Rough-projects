title: Sankarnti Festival Recipe    
description: Celebrate Sankarnti with this traditional recipe. Enjoy the flavors of the festival!
author: Sankarnti
theme: festive
recipe:
  name: Sankarnti Special Dish
  ingredients:
    - 2 cups of rice
    - 1 cup of lentils
    - 1/2 cup of jaggery
    - 1/4 cup of ghee
    - 1 tsp of cardamom powder
    - A handful of nuts and raisins
  instructions: |
    1. Rinse the rice and lentils thoroughly.
    2. Cook the rice and lentils together until soft.
    3. In a separate pan, melt the jaggery with a little water to make a syrup.
    4. Mix the jaggery syrup into the cooked rice and lentils.
    5. Add ghee, cardamom powder, nuts, and raisins to the mixture.
    6. Stir well and cook for another 5 minutes on low heat.
    7. Serve warm and enjoy the festive flavors!